name: Agent and bundled extension
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.artifacts/clean-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify CI dependency fallback
        env:
          CSWEET_RUN_DEPENDENCY_INTEGRATION: '1'
        run: python3 scripts/test-ci-dependencies.py
      - name: Prepare pinned C-Sweet dependencies
        env:
          CSWEET_DEPENDENCY_TOKEN: ${{ secrets.CSWEET_DEPENDENCY_READ_TOKEN }}
        run: python3 scripts/prepare-ci-dependencies.py
      - name: Verify bundled extension provenance
        shell: pwsh
        run: ./scripts/verify-extension.ps1
      - name: Test using pinned package dependencies
        shell: pwsh
        run: |
          $manifest = Get-Content csweet-plugin.json -Raw | ConvertFrom-Json
          dotnet test -c Release -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetMemory=false -p:RestoreSources=https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet run --project $manifest.runtime.projectPath -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed.' }
          dotnet pack $manifest.runtime.projectPath -c Release --no-build --no-restore -o .artifacts/packages -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetMemory=false
          if ($LASTEXITCODE -ne 0) { throw 'Pack failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: .artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Upload dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-ci-dependencies
          path: .artifacts/ci-dependencies/resolved.json
          if-no-files-found: ignore

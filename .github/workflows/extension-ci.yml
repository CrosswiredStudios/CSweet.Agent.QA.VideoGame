name: Agent and bundled extension
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ runner.temp }}/clean-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify bundled extension provenance
        shell: pwsh
        run: |
          $root = 'extensions/video-game'
          $manifest = Get-Content "$root/extension.json" -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash "$root/$($file.Name)" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value) {
              throw "Extension hash mismatch: $($file.Name)"
            }
          }
      - name: Test using only public package dependencies
        shell: pwsh
        run: |
          $manifest = Get-Content csweet-plugin.json -Raw | ConvertFrom-Json
          dotnet test -c Release -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetMemory=false -p:RestoreSources=https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet run --project $manifest.runtime.projectPath -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed.' }
          dotnet pack $manifest.runtime.projectPath -c Release --no-build --no-restore -o .artifacts/packages -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetMemory=false
          if ($LASTEXITCODE -ne 0) { throw 'Pack failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: .artifacts/packages/*.nupkg
          if-no-files-found: error
